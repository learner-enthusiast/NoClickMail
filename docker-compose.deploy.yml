# Production stack for home-server deploy (see .github/workflows/homeserver-deploy.yml).
# Nginx exposes a single port; API routes are reverse-proxied from the web origin.

services:
  api:
    image: ghcr.io/${GHCR_OWNER}/noclickmail-api:${API_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_DB_MIGRATE: "1"
      PORT: "8000"
      NODE_ENV: production
      INTERNAL_URL: http://api:8000
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    image: ghcr.io/${GHCR_OWNER}/noclickmail-web:${WEB_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx.deploy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
