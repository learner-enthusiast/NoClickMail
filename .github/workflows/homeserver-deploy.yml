# SSH deploy to home server — git pull, migrate, restart systemd service.
#
# Required GitHub repository secrets:
#   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, DEPLOY_PATH
#   CF_SERVICE_TOKEN_ID, CF_SERVICE_TOKEN_SECRET  (Cloudflare Access SSH)
#
# One-time on the server:
#   - git clone of this repo at DEPLOY_PATH
#   - production .env at repo root (not committed)
#   - pnpm install && pnpm build
#   - systemd unit: orion (e.g. WorkingDirectory=DEPLOY_PATH, ExecStart=pnpm start)
#   - passwordless sudo for deploy user — see deploy/orion-deploy.sudoers.example

name: Home Server Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  ssh-deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared
        run: |
          curl -L --fail \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o cloudflared.deb
          sudo dpkg -i cloudflared.deb || sudo apt-get install -f -y

      - name: Export Cloudflare service token for cloudflared
        env:
          CF_SERVICE_TOKEN_ID: ${{ secrets.CF_SERVICE_TOKEN_ID }}
          CF_SERVICE_TOKEN_SECRET: ${{ secrets.CF_SERVICE_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          {
            echo "TUNNEL_SERVICE_TOKEN_ID<<EOF"
            echo "$CF_SERVICE_TOKEN_ID"
            echo "EOF"
            echo "TUNNEL_SERVICE_TOKEN_SECRET<<EOF"
            echo "$CF_SERVICE_TOKEN_SECRET"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host homeserver
            HostName ${SSH_HOST}
            User ${SSH_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
            ConnectTimeout 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy on home server
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh homeserver "DEPLOY_PATH='${DEPLOY_PATH}' DEPLOY_SHA='${DEPLOY_SHA}' bash -s" <<'REMOTE'
          set -euo pipefail

          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"

          log() { echo ""; echo "=== $* ==="; }

          log "Deploy preflight (sha=${DEPLOY_SHA})"
          cd "${DEPLOY_PATH}"

          if [ ! -d .git ]; then
            echo "No git repo at ${DEPLOY_PATH}"
            exit 1
          fi

          if [ ! -f .env ]; then
            echo "Missing ${DEPLOY_PATH}/.env"
            exit 1
          fi

          log "git pull"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          git log -1 --oneline

          log "install dependencies"
          pnpm install --frozen-lockfile

          log "build"
          pnpm build

          log "postgres (docker)"
          if [ -f docker-compose.prod-db.yml ]; then
            set -a
            # shellcheck disable=SC1091
            source .env
            set +a
            docker compose -f docker-compose.prod-db.yml --env-file .env up -d postgres
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod-db.yml --env-file .env exec -T postgres \
                pg_isready -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB:-oriondb}" >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            docker compose -f docker-compose.prod-db.yml --env-file .env exec -T postgres \
              pg_isready -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB:-oriondb}"
          else
            echo "docker-compose.prod-db.yml not found — assuming Postgres already running at DATABASE_URL"
          fi

          log "database migrations"
          pnpm db:migrate

          log "restart orion"
          echo "deploy user: $(whoami)"
          if [ -f scripts/restart-orion.sh ]; then
            bash scripts/restart-orion.sh
          else
            sudo -n systemctl restart orion
            sudo -n systemctl is-active orion
          fi

          log "Deploy succeeded (sha=${DEPLOY_SHA})"
          REMOTE

      - name: Dump diagnostics on failure
        if: failure()
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh homeserver "DEPLOY_PATH='${DEPLOY_PATH}' bash -s" <<'REMOTE' || true
          set -uo pipefail
          cd "${DEPLOY_PATH:-.}"
          echo "--- git status ---"
          git status -sb 2>/dev/null || true
          echo "--- deploy user ---"
          whoami 2>/dev/null || true
          id 2>/dev/null || true
          echo "--- sudo test ---"
          sudo -n systemctl is-active orion 2>&1 || true
          echo "--- orion service ---"
          sudo systemctl status orion --no-pager -l 2>/dev/null | tail -30 || true
          echo "--- orion logs ---"
          sudo journalctl -u orion -n 80 --no-pager 2>/dev/null || true
          REMOTE
