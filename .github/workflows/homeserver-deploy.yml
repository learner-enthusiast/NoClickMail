# Deploy NoClickMail to a home server via SSH (Cloudflare Access).
# Images are built in CI, saved as tarballs, and transferred over SSH — no registry pull on the server.
#
# Required GitHub repository secrets:
#
#   Deploy / SSH
#     SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, DEPLOY_PATH
#     CF_SERVICE_TOKEN_ID, CF_SERVICE_TOKEN_SECRET
#
#   Database
#     DATABASE_URL                       (remote Neon/Postgres — daily sync target)
#     POSTGRES_PASSWORD                  (local Postgres password, persisted in pg_data volume)
#
#   App URLs & auth
#     CLIENT_URL                         (public URL, e.g. https://orion.example.com)
#     ACCESS_TOKEN_SECRET, REFRESH_TOKEN_SECRET
#     GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET
#
#   OpenAI & RAG (Pinecone ingest pipeline)
#     OPENAI_API_KEY
#     PINECONE_API_KEY, PINECONE_INDEX
#     OPENAI_EMBEDDING_DIMENSIONS          (must match Pinecone index, e.g. 1024 or 1536)
#     INNGEST_EVENT_KEY, INNGEST_SIGNING_KEY
#
#   Corsair (Gmail / Calendar)
#     CORSAIR_KEK
#     CORSAIR_WEBHOOK_SECRET
#     GMAIL_PUBSUB_TOPIC_ID
#
#   Docker
#     EXTERNAL_PORT                      (host port nginx is published on, e.g. 8080)
#
# Optional secrets (recommended — have sensible defaults):
#   DATABASE_URL_DIRECT                  (remote direct URL for sync; defaults to DATABASE_URL)
#   POSTGRES_USER                        (defaults to postgres)
#   POSTGRES_DB                          (defaults to noclickmail)
#   ACCESS_TOKEN_EXPIRY                  (defaults to 1d)
#   REFRESH_TOKEN_EXPIRY                 (defaults to 30d)
#   GOOGLE_OAUTH_REDIRECT_URI            (defaults to ${CLIENT_URL}/auth/google/callback)
#   CORSAIR_GMAIL_REDIRECT_URI           (defaults to ${CLIENT_URL}/dashboard/inbox)
#   CORSAIR_CALENDAR_REDIRECT_URI        (defaults to ${CLIENT_URL}/dashboard/calendar)
#   CORSAIR_CONNECT_REDIRECT_URI         (defaults to ${CLIENT_URL}/connect/callback)
#   CORSAIR_WEBHOOK_BASE                 (defaults to CLIENT_URL)
#   CORS_ORIGIN                          (defaults to CLIENT_URL)
#   COOKIE_DOMAIN                        (e.g. .example.com for subdomains)
#   OPENAI_EMBEDDING_MODEL               (defaults to text-embedding-3-small)
#   RAG_CHUNK_SIZE                       (defaults to 600)
#   RAG_CHUNK_OVERLAP                    (defaults to 80)
#   LOGGER_LEVEL                         (defaults to info)
#   PUBLIC_OPENAPI_DOCS                  (defaults to false)
#
# One-time on the server: ensure Docker + Docker Compose plugin are installed.

name: Home Server Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  API_IMAGE: noclickmail-api:${{ github.sha }}
  WEB_IMAGE: noclickmail-web:${{ github.sha }}

jobs:
  build-and-deploy:
    name: Build, transfer, and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          load: true
          tags: |
            noclickmail-api:latest
            ${{ env.API_IMAGE }}
          cache-from: type=gha,scope=noclickmail-api
          cache-to: type=gha,mode=max,scope=noclickmail-api

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          load: true
          build-args: |
            NEXT_PUBLIC_API_URL=/trpc
          tags: |
            noclickmail-web:latest
            ${{ env.WEB_IMAGE }}
          cache-from: type=gha,scope=noclickmail-web
          cache-to: type=gha,mode=max,scope=noclickmail-web

      - name: Export images to tarball
        run: |
          set -euo pipefail
          docker save "${{ env.API_IMAGE }}" "${{ env.WEB_IMAGE }}" | gzip -1 > noclickmail-images.tar.gz
          ls -lh noclickmail-images.tar.gz

      - name: Install cloudflared
        run: |
          curl -L --fail \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o cloudflared.deb
          sudo dpkg -i cloudflared.deb || sudo apt-get install -f -y

      - name: Export Cloudflare service token for cloudflared
        env:
          CF_SERVICE_TOKEN_ID: ${{ secrets.CF_SERVICE_TOKEN_ID }}
          CF_SERVICE_TOKEN_SECRET: ${{ secrets.CF_SERVICE_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          {
            echo "TUNNEL_SERVICE_TOKEN_ID<<EOF"
            echo "$CF_SERVICE_TOKEN_ID"
            echo "EOF"
            echo "TUNNEL_SERVICE_TOKEN_SECRET<<EOF"
            echo "$CF_SERVICE_TOKEN_SECRET"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          cat > ~/.ssh/config <<EOF
          Host homeserver
            HostName ${SSH_HOST}
            User ${SSH_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
            ConnectTimeout 30
          EOF

          chmod 600 ~/.ssh/config

      - name: Create production env file
        env:
          SYNC_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SYNC_DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
          ACCESS_TOKEN_EXPIRY: ${{ secrets.ACCESS_TOKEN_EXPIRY }}
          REFRESH_TOKEN_EXPIRY: ${{ secrets.REFRESH_TOKEN_EXPIRY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REDIRECT_URI: ${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_EMBEDDING_MODEL: ${{ secrets.OPENAI_EMBEDDING_MODEL }}
          OPENAI_EMBEDDING_DIMENSIONS: ${{ secrets.OPENAI_EMBEDDING_DIMENSIONS }}
          RAG_CHUNK_SIZE: ${{ secrets.RAG_CHUNK_SIZE }}
          RAG_CHUNK_OVERLAP: ${{ secrets.RAG_CHUNK_OVERLAP }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX: ${{ secrets.PINECONE_INDEX }}
          INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}
          INNGEST_SIGNING_KEY: ${{ secrets.INNGEST_SIGNING_KEY }}
          CORSAIR_KEK: ${{ secrets.CORSAIR_KEK }}
          CORSAIR_GMAIL_REDIRECT_URI: ${{ secrets.CORSAIR_GMAIL_REDIRECT_URI }}
          CORSAIR_CALENDAR_REDIRECT_URI: ${{ secrets.CORSAIR_CALENDAR_REDIRECT_URI }}
          CORSAIR_CONNECT_REDIRECT_URI: ${{ secrets.CORSAIR_CONNECT_REDIRECT_URI }}
          CORSAIR_WEBHOOK_BASE: ${{ secrets.CORSAIR_WEBHOOK_BASE }}
          CORSAIR_WEBHOOK_SECRET: ${{ secrets.CORSAIR_WEBHOOK_SECRET }}
          GMAIL_PUBSUB_TOPIC_ID: ${{ secrets.GMAIL_PUBSUB_TOPIC_ID }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          COOKIE_DOMAIN: ${{ secrets.COOKIE_DOMAIN }}
          EXTERNAL_PORT: ${{ secrets.EXTERNAL_PORT }}
          LOGGER_LEVEL: ${{ secrets.LOGGER_LEVEL }}
          PUBLIC_OPENAPI_DOCS: ${{ secrets.PUBLIC_OPENAPI_DOCS }}
        run: |
          set -euo pipefail
          umask 077

          require_secret() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          }

          CLIENT="${CLIENT_URL%/}"
          BASE="${CLIENT}"
          GOOGLE_REDIRECT="${GOOGLE_OAUTH_REDIRECT_URI:-${CLIENT}/auth/google/callback}"
          CORS="${CORS_ORIGIN:-${CLIENT}}"
          CORSAIR_GMAIL="${CORSAIR_GMAIL_REDIRECT_URI:-${CLIENT}/dashboard/inbox}"
          CORSAIR_CALENDAR="${CORSAIR_CALENDAR_REDIRECT_URI:-${CLIENT}/dashboard/calendar}"
          CORSAIR_CONNECT="${CORSAIR_CONNECT_REDIRECT_URI:-${CLIENT}/connect/callback}"
          CORSAIR_WEBHOOK="${CORSAIR_WEBHOOK_BASE:-${CLIENT}}"
          PG_USER="${POSTGRES_USER:-postgres}"
          PG_DB="${POSTGRES_DB:-noclickmail}"
          REMOTE_SYNC="${SYNC_DATABASE_URL_DIRECT:-$SYNC_DATABASE_URL}"
          LOCAL_DB="postgresql://${PG_USER}:${POSTGRES_PASSWORD}@postgres:5432/${PG_DB}"
          TOKEN_ACCESS_EXPIRY="${ACCESS_TOKEN_EXPIRY:-1d}"
          TOKEN_REFRESH_EXPIRY="${REFRESH_TOKEN_EXPIRY:-30d}"
          EMBEDDING_MODEL="${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}"
          RAG_SIZE="${RAG_CHUNK_SIZE:-600}"
          RAG_OVERLAP="${RAG_CHUNK_OVERLAP:-80}"

          require_secret POSTGRES_PASSWORD "${POSTGRES_PASSWORD:-}"
          require_secret CLIENT_URL "${CLIENT:-}"
          require_secret ACCESS_TOKEN_SECRET "${ACCESS_TOKEN_SECRET:-}"
          require_secret REFRESH_TOKEN_SECRET "${REFRESH_TOKEN_SECRET:-}"
          require_secret GOOGLE_OAUTH_CLIENT_ID "${GOOGLE_OAUTH_CLIENT_ID:-}"
          require_secret GOOGLE_OAUTH_CLIENT_SECRET "${GOOGLE_OAUTH_CLIENT_SECRET:-}"
          require_secret OPENAI_API_KEY "${OPENAI_API_KEY:-}"
          require_secret PINECONE_API_KEY "${PINECONE_API_KEY:-}"
          require_secret PINECONE_INDEX "${PINECONE_INDEX:-}"
          require_secret OPENAI_EMBEDDING_DIMENSIONS "${OPENAI_EMBEDDING_DIMENSIONS:-}"
          require_secret INNGEST_EVENT_KEY "${INNGEST_EVENT_KEY:-}"
          require_secret INNGEST_SIGNING_KEY "${INNGEST_SIGNING_KEY:-}"
          require_secret CORSAIR_KEK "${CORSAIR_KEK:-}"
          require_secret CORSAIR_WEBHOOK_SECRET "${CORSAIR_WEBHOOK_SECRET:-}"
          require_secret GMAIL_PUBSUB_TOPIC_ID "${GMAIL_PUBSUB_TOPIC_ID:-}"
          require_secret SYNC_DATABASE_URL "${REMOTE_SYNC:-}"
          require_secret EXTERNAL_PORT "${EXTERNAL_PORT:-}"

          EMBEDDING_DIMENSIONS="${OPENAI_EMBEDDING_DIMENSIONS}"

          {
            printf 'POSTGRES_USER=%s\n' "$PG_USER"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'POSTGRES_DB=%s\n' "$PG_DB"
            printf 'PORT=8000\n'
            printf 'NODE_ENV=production\n'
            printf 'BASE_URL=%s\n' "$BASE"
            printf 'CLIENT_URL=%s\n' "$CLIENT"
            printf 'CORS_ORIGIN=%s\n' "$CORS"
            printf 'DATABASE_URL=%s\n' "$LOCAL_DB"
            printf 'DATABASE_URL_DIRECT=%s\n' "$LOCAL_DB"
            printf 'SYNC_DATABASE_URL=%s\n' "$REMOTE_SYNC"
            printf 'ACCESS_TOKEN_SECRET=%s\n' "$ACCESS_TOKEN_SECRET"
            printf 'REFRESH_TOKEN_SECRET=%s\n' "$REFRESH_TOKEN_SECRET"
            printf 'ACCESS_TOKEN_EXPIRY=%s\n' "$TOKEN_ACCESS_EXPIRY"
            printf 'REFRESH_TOKEN_EXPIRY=%s\n' "$TOKEN_REFRESH_EXPIRY"
            printf 'GOOGLE_OAUTH_CLIENT_ID=%s\n' "$GOOGLE_OAUTH_CLIENT_ID"
            printf 'GOOGLE_OAUTH_CLIENT_SECRET=%s\n' "$GOOGLE_OAUTH_CLIENT_SECRET"
            printf 'GOOGLE_OAUTH_REDIRECT_URI=%s\n' "$GOOGLE_REDIRECT"
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'OPENAI_EMBEDDING_MODEL=%s\n' "$EMBEDDING_MODEL"
            printf 'OPENAI_EMBEDDING_DIMENSIONS=%s\n' "$EMBEDDING_DIMENSIONS"
            printf 'RAG_CHUNK_SIZE=%s\n' "$RAG_SIZE"
            printf 'RAG_CHUNK_OVERLAP=%s\n' "$RAG_OVERLAP"
            printf 'PINECONE_API_KEY=%s\n' "$PINECONE_API_KEY"
            printf 'PINECONE_INDEX=%s\n' "$PINECONE_INDEX"
            printf 'INNGEST_EVENT_KEY=%s\n' "$INNGEST_EVENT_KEY"
            printf 'INNGEST_SIGNING_KEY=%s\n' "$INNGEST_SIGNING_KEY"
            printf 'CORSAIR_KEK=%s\n' "$CORSAIR_KEK"
            printf 'CORSAIR_GMAIL_REDIRECT_URI=%s\n' "$CORSAIR_GMAIL"
            printf 'CORSAIR_CALENDAR_REDIRECT_URI=%s\n' "$CORSAIR_CALENDAR"
            printf 'CORSAIR_CONNECT_REDIRECT_URI=%s\n' "$CORSAIR_CONNECT"
            printf 'CORSAIR_WEBHOOK_BASE=%s\n' "${CORSAIR_WEBHOOK%/}"
            printf 'CORSAIR_WEBHOOK_SECRET=%s\n' "$CORSAIR_WEBHOOK_SECRET"
            printf 'GMAIL_PUBSUB_TOPIC_ID=%s\n' "$GMAIL_PUBSUB_TOPIC_ID"
            printf 'COOKIE_DOMAIN=%s\n' "${COOKIE_DOMAIN:-}"
            printf 'LOGGER_LEVEL=%s\n' "${LOGGER_LEVEL:-info}"
            printf 'PUBLIC_OPENAPI_DOCS=%s\n' "${PUBLIC_OPENAPI_DOCS:-false}"
            printf 'NEXT_PUBLIC_API_URL=/trpc\n'
            printf 'API_INTERNAL_URL=http://api:8000\n'
            printf 'EXTERNAL_PORT=%s\n' "$EXTERNAL_PORT"
            printf 'API_IMAGE_TAG=%s\n' "${{ github.sha }}"
            printf 'WEB_IMAGE_TAG=%s\n' "${{ github.sha }}"
          } > .env.deploy
          chmod 600 .env.deploy

      - name: Upload images, compose, nginx config, and env
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh homeserver "mkdir -p '${DEPLOY_PATH}'"
          scp noclickmail-images.tar.gz "homeserver:${DEPLOY_PATH}/noclickmail-images.tar.gz"
          scp docker-compose.deploy.yml "homeserver:${DEPLOY_PATH}/docker-compose.deploy.yml"
          scp docker/nginx.deploy.conf "homeserver:${DEPLOY_PATH}/nginx.deploy.conf"
          scp docker/db-sync-entrypoint.sh "homeserver:${DEPLOY_PATH}/db-sync-entrypoint.sh"
          scp .env.deploy "homeserver:${DEPLOY_PATH}/.env"
          ssh homeserver "chmod +x '${DEPLOY_PATH}/db-sync-entrypoint.sh'"

      - name: Load images and restart containers
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh homeserver \
            "DEPLOY_PATH='${DEPLOY_PATH}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          echo "Loading Docker images..."
          gunzip -c noclickmail-images.tar.gz | docker load
          rm -f noclickmail-images.tar.gz

          docker compose -f docker-compose.deploy.yml --env-file .env up -d --remove-orphans
          docker image prune -f
          REMOTE

      - name: Wait for services to start
        run: |
          echo "Waiting 10 minutes for containers to start (migrations, API, web)..."
          sleep 600

      - name: Health check
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh homeserver \
            "DEPLOY_PATH='${DEPLOY_PATH}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          set -a
          # shellcheck disable=SC1091
          source .env
          set +a
          PORT="${EXTERNAL_PORT:-8080}"

          echo "=== Container status ==="
          docker compose -f docker-compose.deploy.yml --env-file .env ps

          echo "=== Migrate logs ==="
          docker compose -f docker-compose.deploy.yml --env-file .env logs migrate || true

          echo "=== API logs (last 120 lines) ==="
          docker compose -f docker-compose.deploy.yml --env-file .env logs api --tail 120 || true

          curl -fsS -o /dev/null -w "Web HTTP %{http_code}\n" \
            --retry 8 --retry-delay 5 --retry-all-errors \
            "http://127.0.0.1:${PORT}/"

          curl -fsS -o /dev/null -w "API HTTP %{http_code}\n" \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "http://127.0.0.1:${PORT}/health"
          REMOTE
