upstream api {
    server api:8000;
}

upstream web {
    server web:3000;
}

server {
    listen 80;
    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /trpc {
        proxy_pass http://api;
    }

    location /health {
        proxy_pass http://api;
    }

    location /auth {
        proxy_pass http://api;
    }

    location /connect {
        proxy_pass http://api;
    }

    location /webhooks {
        proxy_pass http://api;
    }

    location /events {
        proxy_pass http://api;
    }

    location /api {
        proxy_pass http://api;
    }

    location = /openapi.json {
        proxy_pass http://api;
    }

    location /docs {
        proxy_pass http://api;
    }

    location / {
        proxy_pass http://web;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
